# ============================================================
#  站点配方 · WorkBuddy (codebuddy.cn)
#  形态：auto —— 复用专用 Chrome 里已登录的网页会话，在页面上下文里 fetch 签到接口。
#  红线：不逆向、不解密桌面端 token、不伪造指纹；token 全程留在浏览器内。
#
#  路径前缀的依据（2026-09-24 从 app.asar 的 CloudAccountRepo 取证）：
#    - Web（Cloud）：billingPrefix = ""      → /billing/meter/...   ← 走浏览器 cookie 认证，我们用这条
#    - Desktop     ：覆盖为 "/v2"            → /v2/billing/meter/... ← 走 IDE 网关 Bearer token
#  实测两者在本机浏览器里都返回 200，但既然我们是"浏览器 + cookie"，
#  就走网页端自己的那条，行为更像正常用户。若哪天它 404，可回退 /v2/ 前缀。
#
#  ⚠ 别把 status 换成 /billing/meter/checkin-status：
#    那是已废弃的僵尸接口，恒返回 active=false / streak_days=0 / code=0，
#    会伪装成"永远成功"。活的是 checkin-activity-status。
# ============================================================
id: workbuddy
name: WorkBuddy 每日签到
enabled: true
mode: auto            # auto | manual | disabled

origin: https://www.codebuddy.cn

session:
  kind: browser_page
  start_url: https://www.codebuddy.cn/home/
  tab_match: ["codebuddy.cn"]
  # 留空 => 运行时在已登录页面的 localStorage 里自动探测 token 键；
  # 若用 --probe 看到了确切键名，可填在这里锁定。
  token_localstorage_key: ""

actions:
  status:
    method: POST          # 必须 POST。只接受 POST 的路由遇到 GET 会回 404，
    path: /billing/meter/checkin-activity-status
    body: {}              # 看起来像"接口不存在"，极易误判。
  trigger:
    method: POST
    path: /billing/meter/daily-checkin
    body: {}

# 灵魂：HTTP 状态码不作数，只按响应体的业务 code 判定（接口会返回 HTTP 400 但 code=0 表示成功）
verdict:
  transport: body_code
  rules:
    - { code: 0,     result: success }
    - { code: 10001, result: already }
  http_401_result: need_login     # 网页会话未登录/过期 => 转人工，绝不重试硬刚
  unknown_result: no_action       # 不认识的 code：只记日志，不重试、不动作
  # code=0 只代表"请求成功"，不代表"今天领到了"。真正的状态在 data.today_checked_in。
  # 有它才能区分「我刚领到」与「我今天早就领过了」，也才能在已签时不再多发一次 trigger。
  checked_in_flag: today_checked_in
  # 写接口的业务结论在 data.status，取值抄自客户端自己的判别词表 CheckinClaimStatus。
  # 优先级高于上面的 code 规则：只看 code 会把「活动已结束」误报成「已领取」。
  result_flag: status
  result_map:
    claimed: success
    already_claimed: already
    not_eligible: no_action       # 不满足条件（比如非工作日）—— 不重试，不报错
    event_ended: no_action        # 活动结束 —— 不重试
    unknown_biz_error: no_action  # 未知业务拒绝 —— 只记日志

safety_overrides:
  daily_success_limit: 1

schedule_hint:
  timezone: Asia/Shanghai
  refresh_hour_utc8: 0

reminder:
  # need_login 的主动提醒（2026-09-28 新增）。
  #
  # 背景：登录态会**自然失效** —— 实测 `session` / `session_2` 两个 cookie 的有效期
  # 都是 **168 小时（恰好 7 天）**，到期后只能人工重登（天天访问页面也并不能无限续期）。
  # 而原先 need_login **只写日志**，界面上毫无动静：2026-09-28 当天 10:51 就已判定
  # 未登录，用户直到 12:29 自己来问才发现 —— 白白漏了半天。**这才是真正的问题**，
  # 不是 401 本身（401 意味着会话真过期了，转人工是正确行为）。
  # 所以补上这条通知，把"静默漏签"变成"看得见的待办"。
  toast_title: "WorkBuddy 签到需重新登录"
  toast_body: "签到专用浏览器的登录态已失效。请运行 python -m checkin --login 登录后补签。"

# ============================================================
#  client 模式配置（预置，**尚未启用**）
# ============================================================
#  背景（2026-10-06）：网页侧的 cookie 会话实测 **168 小时（恰好 7 天）**到期，
#  到期只能人工重登。09-28 重登 → 10-06 又 401，周期性发生，是结构性成本。
#
#  客户端内的签到**不需要我们维护任何登录态** —— 客户端自己持有并续期 token。
#  实测取证（静态只读，未逆向、未碰加密文件）：
#    · 客户端内有签到 UI（不是网页，是 workbench 自己的 DOM）：
#      `.daily-checkin` / `.daily-checkin--bubble` / `.daily-checkin--menu-banner`
#      （横幅挂在用户菜单里，紧邻 `.user-menu-trigger-wrapper`）
#    · 客户端内有签到接口（Electron IPC channel）：
#      `authGetCheckinStatus` / `authClaimDailyCheckin` / `authGetActivityBanner`
#    · 业务接口与网页端**同一个**：POST `${billingPrefix}/billing/meter/daily-checkin`
#      ⇒ 同一份奖励，client 模式**不会**提高成功率，价值只在"免维护登录态"。
#
#  ⚠ `mode` 仍是 `auto` —— 下面的字段**故意留空等着实测**。
#    留空 = 安全：`_wait_target` 在 match 为空时永不命中，不会误点任何东西。
#    首次接管（WorkBuddy 带端口启动后）用 CDP 侦察真实 DOM，再补齐并切 mode。
#
#  ⚠ `close_after` 必须保持 false：桌面端是用户全天在用的主力工具，
#    **绝不能**像 Qoder 那样"领完就关"。这条是硬约束，不是偏好。
client:
  # 调试端口 —— **单一事实源**：tools/win_shortcut_args.py 写快捷方式时读的就是这里。
  # 9333 = 网页侧专用浏览器；9335 = Qoder 客户端；本机 9336 已实测空闲（2026-10-06）。
  debug_port: 9336
  # electron-builder 的 per-user 安装，路径固定，没有 Qoder 那种 `.qoder-versions\*\` 滚动目录。
  exe: '%LOCALAPPDATA%\Programs\WorkBuddy\WorkBuddy.exe'
  exe_glob: ''
  # 按命令行匹配主进程（会排除 --type=* 渲染/GPU 子进程 与 app-host.cjs 助手）
  process_match: 'WorkBuddy.exe'
  # VSCode 系客户端启动慢，给足时间（Qoder 是 60s）
  launch_timeout_sec: 90
  target_timeout_sec: 30
  # ---- 待实测：首次接管时侦察后填 ----
  # 签到横幅在**主窗口**里（没有 Qoder 那种独立活动 OAFIF），
  # 所以 target_match 与 main_target_match 预计指向同一个主窗口 URL。
  target_match: ''
  main_target_match: ''
  # 按钮文案由**服务端下发**（`claim_button_text`），不能假设固定值；
  # 实测出真实文案后填这里，或改为按容器 `.daily-checkin` 定位。
  claim_button: ''
  claimed_markers: ['已领取', '领取成功']
  open_entry_labels: []      # 待实测：点开用户菜单的 aria-label 序列
  entry_delay_sec: 1.5
  entry_timeout_sec: 20
  # 日志结构是 `logs\<日期>\*MainThread*.log`，与 Qoder 的 `logs\<session>\main.log`
  # 不同 ⇒ 分支①的"零打扰预检"会自动跳过（_log_state 返回 None），不影响主流程。
  data_dir: ''
