# ============================================================
#  站点配方 · Qoder CN (QoderWork CN 桌面端)
#  形态：client —— 把桌面客户端拉起来，用它的 UI 完成领取，领完再关掉。
#
#  ---- 2026-09-25 12:xx 全流程实测通过（WorkBuddy/阿拾）----
#  今日 100 Credits 已由本驱动自动领取成功，双证据闭环：
#    · 界面：按钮「领取」→「已领取」+ disabled，页面出现「领取成功，Credits 已到账」
#    · 服务端（main.log）：03:52:12Z forceRefresh 后 claimable: true → false
#                            （= 北京时间 11:52:12，与点击时刻一致）
#
#  ---- 为什么"网页自动化"不通，而"客户端自动化"通 ----
#  【不通：网页】
#    1) 领取页 https://openapi.qoder.com.cn/growth-page/activity-iframe 是
#       **宿主驱动的 iframe**：靠 postMessage 与父窗口通信（protocol="qoder.campaign"），
#       校验父窗口来源必须属于 qoder.cn / qoder.com / qoder.ai；源码里
#       `Ne = window.parent === window` ⇒ **独立打开时忽略所有消息**，永远等不到数据。
#    2) 实测（CDP 打开该页、未登录、抓全量网络）：页面自己发
#       GET /sash/api/v1/me/campaigns → 401 {"code":"TOKEN_INVALID"}，
#       请求头**没有**设备指纹也没有登录 cookie。
#       ⇒ 它要的是 **Authorization token**，来源是桌面端主进程，不是浏览器 cookie。
#    3) 客户端侧同一接口由 Electron 主进程携带设备指纹
#       （Cosy-MachineId / Cosy-MachineToken）发出 —— 复刻设备指纹 = 伪造设备身份，
#       正踩风控红线，**坚决不做**。
#    ⇒ 结论：不要试图在浏览器里登录后打开领取页，那条路根本不成立。
#
#  【通：客户端】
#    活动页在客户端里就是个 **OOPIF**（独立 target，`type=="iframe"`），
#    由主进程注入 token 后正常渲染。用 CDP 附着上去、派发一次真实点击即可。
#    关键是三条（都踩过坑，详见 src/checkin/core/procenv.py 与 drivers/client_claim.py）：
#      a) **必须清环境启动**：Agent 环境里的 ELECTRON_RUN_AS_NODE=1 会让 Electron
#         退化成 Node，静默失败（只剩一个 xxx-app-host.cjs，日志目录不产生新 session）。
#         → 一律走 core.procenv.spawn()。清环境后 Popen 直启，实测 2 秒端口就绪。
#      b) **要点的是 OOPIF 里的按钮**：父页面 querySelector 只看到 <iframe> 元素，
#         必须 target_types=["page","iframe"] 直连它自己的 websocket。
#      c) **点击要用完整事件序列**：该 UI 绑 pointerdown，`el.click()` 无效。
#
#  【活动入口由服务端状态驱动 —— 决定了自动化的时序】
#    · 只在 `claimable=true` 时客户端才**自动打开**活动 Surface（source:"automatic"），
#      启动后约 3-6 秒出现；**判定发生在启动那一刻** —— 所以客户端整天开着时，
#      次日开窗后入口不会自己冒出来（补救见下面 client.open_entry_labels）；
#    · 领取成功后该 target **整个消失**。
#    ⇒ 必须"启动后立即抢窗口"（驱动内是轮询等 target，不是固定 sleep）；
#      且**不能**用"入口在不在"判断今天领没领 —— 要以 main.log 的 claimable 为准。
#      驱动已实现零打扰预检：先读日志，已领就直接返回，连客户端都不启动。
#
#  【不打断用户】（2026-10-14 收窄）
#    若客户端**已在运行**（用户在写代码），默认**不动它**，降级为发提醒。
#    只有"客户端没在跑"时才由我们拉起，并在领取后关闭，把环境还原。
#    ⚠ 唯一例外：端口**绑定失败**（带了端口参数却连不上 = 不会自愈）时，
#      配方开启 `restart_on_bind_failure` 才会**自行重启客户端并当场重试**。
#
#  【仍然成立的旧结论】客户端主进程轮询 GET /sash/api/v1/me/campaigns，
#    响应含 {showCampaign, claimable, campaignUrl, campaigns[]}；
#    领取页 URL 来自响应的 campaignUrl（不是写死在 asar 里的）。
# ============================================================
id: qoder
name: Qoder CN 每日 100 Credits
enabled: true
mode: client

client:
  # ⚠ 2026-10-15 踩坑（当天真漏签，连试 6 次全败）：原来这里用 glob 指向
  #   `.qoder-versions\*\Qoder CN.exe`（**内层实际程序**），等于**绕过顶层启动器**。
  #   当天 Qoder 升级到 0.4.7 后，直接调内层 exe 会**起来就退** —— 60s 内端口始终不就绪；
  #   改用顶层启动器后 **2.4 秒**端口就绪（netstat + curl 双重确认）。
  #   启动器负责**单实例锁 / 版本切换 / 参数透传**，这三件内层 exe 都不做。
  #   （版本目录仍会滚动累积，但那是启动器的事，不该由我们猜。）
  exe: '%LOCALAPPDATA%\Programs\Qoder CN\Qoder CN.exe'
  exe_glob: ''
  # 调试端口 —— **单一事实源**：`tools/win_shortcut_args.py` 写快捷方式时读的就是这里，
  # 驱动也读这里，不要在任何地方再硬编码一份（三处各写一份必然漂移）。
  #
  # ⚠ 端口是**一次性资源**：被僵尸句柄占住就只能换端口（或重启机器）。
  #   同一个病已经踩了三次，前两次形态一致（9334 / 9335）：
  #     带端口的实例退出后，它的监听 socket 被某个**继承了句柄的子进程**继续持有 ——
  #     内核 TCP 表里仍记在**已死 PID** 名下（`Get-NetTCPConnection` 显示 Listen + CloseWait），
  #     表现为「netstat 显示 LISTENING，但 curl 连不上、新进程也绑不上」的**僵尸监听**：
  #     裸 bind 报 10048，带 SO_REUSEADDR 报 10013（独占），且都不在系统保留段。
  #   · 9334 始末：09-25 带端口的实例（PID 23500）在 0.4.3 升级时退出 ⇒ 被占（09-27 发现）。
  #   · 9335 始末：10-09 13:15:48 起的实例（PID 24160）在 10-10 16:17 被重启取代 ⇒ 被占
  #     （10-11 发现，当天 Qoder 因此漏签）。客户端日志目录名可直接点名进程：
  #     `%APPDATA%\com.qodercn.app.stable\logs\20261009-051548.662-24160-*`。
  #   ⇒ **仅重启 Qoder 拿不回端口**，只能换端口或重启机器（故轮到 9337）。
  #   ⚠ 排查判据：`curl http://127.0.0.1:<port>/json/version` —— 僵尸端口连不上，
  #     而**活跃**端口能连上。注意「裸 bind 失败」**不能**区分两者（活跃端口同样绑不上）。
  debug_port: 9340
  # 活动页在 /json 里的 target url 特征串
  target_match: 'growth-page'
  # 领取按钮文本
  claim_button: '领取'
  # 视为"已领取"的界面文案。⚠ **只用于"找不到按钮时"的辅助判定**，
  # 且判之前会先做一次「陈旧快照复核」（重载页面重新取状态，见
  # client_claim._recheck_stale）。原因：这些文案会留在**跨天未关闭**的
  # 活动 Surface 里 —— 单凭它判 already 会在次日静默漏签一整天（2026-10-06 真发生）。
  claimed_markers: ['已领取', '领取成功']
  # 定位"客户端是否在跑"用（按命令行匹配，会排除 native-messaging-host 子进程）
  process_match: 'Qoder CN.exe'
  # 客户端 userData 目录，用于零打扰预检（读 logs/<session>/main.log 的 claimable）
  data_dir: '%APPDATA%\com.qodercn.app.stable'
  launch_timeout_sec: 60
  target_timeout_sec: 25
  # ---- 客户端"整天常开"场景的补救（2026-09-26 实测新增）----
  # 活动入口**是否自动打开**由"客户端启动那一刻"的服务端状态决定。
  # 客户端整天开着（实测 uptime 13h）时，10:00 开窗后入口不会自己出现，
  # 驱动干等一轮只能报 no_action —— **当天就领不到**（2026-09-26 真发生，
  # 当天是手动点开用量面板 → 礼物图标才补领成功的）。
  # 补救：按顺序点击下面这些入口（值 = 目标元素 aria-label 的**子串**），
  #       把活动 Surface 从用量面板里调出来。点不到会静默退回原行为，不劣化。
  open_entry_labels:
    - '查看我的用量'      # 左下角 → 打开用量面板（礼物图标在面板底部）
                          # ⚠ 客户端升级后该元素的 aria 实际为
                          #   `查看我的用量，有权益活动待领取`；匹配用**子串**，仍命中
    - '打开 Rewards'      # 面板底部礼物图标；有未领时它右上角带一个红点。⚠ 只有 aria
  # 「回到主工作区」的按钮（按 innerText **精确**匹配）。
  # ⚠ 2026-10-11 实测真失败：客户端重启后落在**设置页**（`#/settings?section=profile`），
  #   那一层**没有**上面两个入口 ⇒ 全 no-button ⇒ 等预算耗尽 ⇒ `no_action` ⇒ 当天漏签
  #   （当天靠人工把窗口切回主工作区才补上）。故推进入口前先点这个按钮回主工作区。
  #   幂等：主工作区里不存在该按钮 ⇒ 找不到即 no-button，无副作用。
  #   ⚠ 该按钮**只有文本、没有 aria-label** → 只能用按文本匹配的实现。
  home_labels:
    - '返回应用'
  # 客户端主窗口 url 特征 —— 入口点击必须在主文档里做，不能在活动 OOPIF 里
  main_target_match: 'renderer/index.html'
  # 入口点击的时序（2026-10-10 修 —— 当天因此没领到）
  #   entry_delay_sec  = **点中一个入口后**的静默期，等下一层（面板/浮层）渲染
  #   entry_timeout_sec= 单个入口"**轮询到它可点为止**"的上限，同时也用作
  #                      调出入口后等待活动 target 出现的上限
  # 教训：10-10 点『查看我的用量』成功后，面板要 **3 秒**才渲染出礼物图标，
  #       而当时这里是 1.5 且实现是"盲等一次就放弃" ⇒ 第二个入口 no-button ⇒
  #       当天报 no_action。实现已改为轮询（自适应渲染快慢），这里给足静默期。
  entry_delay_sec: 3.0
  entry_timeout_sec: 20
  # 领取后关闭我们拉起的客户端（不留调试端口 = 不留后门）。关掉的只是"我们起的那个"。
  close_after: true

  # 无端口守候（2026-10-11 新增，与 workbuddy 对齐）：
  #   调试端口只能在**启动时**绑定，而客户端可能连续数天不重启 ⇒ 那个实例整个生命周期
  #   都接管不了，**每天**静默漏签。
  #   ⚠ 2026-10-10 那次只在 workbuddy 一侧配了这个字段 ⇒ 10-11 当天 Qoder 无端口时
  #     **立刻放弃**（`客户端已在运行且未开调试端口…降级为提醒`），而 WorkBuddy 顺利接管。
  #     教训：这类"补救"字段必须在两侧**对称**配置，不对称 = 等于没修。
  #   缺省 0 = 不守候。窗口 10:05–12:30，取 90 分钟覆盖主时段。
  wait_port_sec: 5400

  # 端口绑定失败（命令行带了端口、端口却连不上 ⇒ 已知不会自愈）时，自动重启客户端
  # 并当场重试。用户 2026-10-14 授权"该重启重启，不要摆着"。
  restart_on_bind_failure: true

  # ---- 重启前的"忙闲"把关（用户 2026-10-14 要求）----
  # 用户原话："需要重启的话也不要直接重启，看看有没有在执行的任务，有的话就先不重启，
  # 挂载任务监测着，等任务执行完了再重启。"
  # 只有判定为**空闲**才放行；忙则挂载监测（最多 wait_busy_sec）；**看不清同样不重启**
  # （宁可漏签，也不能赌一把打断用户正在跑的任务）。
  #
  # ⚠ 本站点用的是**通用判据**：2026-10-14 侦察时该客户端空闲，拿不到"忙时"的真实特征
  #    （侧栏虽有任务项，但没有任何 running/executing 状态标识）。判据如下：
  #      class / aria-label 含 running|processing|loading|spinner|busy，
  #      或可见短文本（<24 字）含 执行中/运行中/进行中/处理中/排队中/等待中。
  #    判据词**刻意不含** execution / progress —— 那类词在空闲态也会出现
  #    （实测 Trae 空闲时就有 `task-panel-slide-executions`），含了会永远误判为忙。
  #    取向偏保守：宁可多等一会儿，也不能误判为空闲而错误重启。
  #    ⇒ 将来若发现漏判（有任务却没被认出），应优先**加强判据**而不是放宽。
  busy_probe:
    busy_js: |
      (() => {
        const vis = el => { try { const r = el.getBoundingClientRect();
          return r.width > 0 && r.height > 0; } catch (e) { return false; } };
        const cn = el => { const c = el.className;
          return typeof c === 'string' ? c : (c && c.baseVal) || ''; };
        const txt = el => ((el.innerText || el.textContent || '') + '').trim();
        const deepAll = (root, sel, out, depth) => {
          out = out || []; depth = depth || 0; if (depth > 12) return out;
          let list = []; try { list = root.querySelectorAll(sel); } catch (e) { return out; }
          for (const el of list) out.push(el);
          let kids = []; try { kids = root.querySelectorAll('*'); } catch (e) { return out; }
          for (const el of kids) if (el.shadowRoot) deepAll(el.shadowRoot, sel, out, depth + 1);
          return out;
        };
        const CLS = /running|processing|loading|spinner|busy/i;
        const TXT = /执行中|运行中|进行中|处理中|排队中|等待中/;
        for (const el of deepAll(document, '*')) {
          if (!vis(el)) continue;
          const c = cn(el);
          if (c && CLS.test(c)) return true;
          const a = el.getAttribute ? (el.getAttribute('aria-label') || '') : '';
          if (a && (CLS.test(a) || TXT.test(a))) return true;
          const t = txt(el);
          if (t && t.length < 24 && TXT.test(t)) return true;
        }
        return false;
      })()
    # 监测上限（秒）。超时则降级提醒，绝不无限等。
    wait_busy_sec: 1800

reminder:
  # 留空：实测 qoder-cn: 协议在客户端已运行时无任何效果。
  # 现在的角色变了 —— 它不再是主路径，而是**降级路径**的文案：
  # 客户端已在运行时（无法接管）驱动会发这条提醒请用户手动领。
  open_target: ''
  # 开窗时刻闸门（HH:MM，UTC+8）：早于此刻不动作，且不消耗当天的额度。
  # 同时被 client 驱动复用为"活动窗口起点"，用来判断日志里的状态是否属于当前窗口。
  not_before: '10:00'
  toast_title: 'Qoder CN 每日签到提醒'
  toast_body: '打开 Qoder CN 桌面端 → 左下角『用量面板』→ 礼物图标 → 领取本轮 100 Credits。每日 10:00 开窗，次日 10:00 前有效，错过不可补领。'
  note: '官方口径（docs.qoder.cn/events/100credits）：领取渠道仅限 Qoder CN 桌面端；每日 10:00 开新一轮；2026-09-18 10:00 起，结束另行公告。'

schedule_hint:
  timezone: Asia/Shanghai
  # 官方开窗时刻 = 每日 10:00（本字段仅供人读，代码未引用；真正生效的是 reminder.not_before）
  refresh_hour_utc8: 10
