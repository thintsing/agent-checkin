# ============================================================
#  站点配方 · 豆包工作（DoubaoWork）
#  形态：client —— 接管桌面客户端，在它**内置浏览器**里调活动接口完成签到。
#
#  ---- 2026-10-21 真机取证（CDP 只读 + 一次真实点击，全程未逆向鉴权）----
#  客户端 2.33.3，Chromium 147.0.7727.149，**不是 Electron**，是字节自研 "aha" 框架
#  （DoubaoWork.dll 323MB，前端是 standalone pak bundle，没有 app.asar 可翻）。
#  userData = %LOCALAPPDATA%\DoubaoWork\User Data
#  调试端口 9342（外层启动器 `Application\DoubaoWork.exe` **会透传** --remote-debugging-port）
#
#  签到入口：左下角头像菜单 →「免费领额度」→ 内置浏览器打开活动页
#            https://www.doubao.com/pc/agent-explore
#            （文案「从容开工，豆包额度天天送 / 每天签到领 200 额度」）
#
#  接口（活动页自己发的，抓包实录）：
#      POST /alice/ug/campaign/v3/detail/           body {campaign_group_code}
#           → data.tasks[] 里 campaign_code=="daily_signin" 的 task_status
#             3 = 今日已签；1 = 未签（其余任务是 1）
#           → data.progress.total_amount 累计额度（可作交叉验证）
#      POST /alice/ug/campaign/landing/checkin      body {scene:"pc_incentive_task_mvp_v3"}
#
#  ---- 2026-10-21 真机实测（端到端全通）----
#     before : {"status":200,"code":0,"total":0,"signStatus":1}
#     click  : 页面文本 "已获得 0 点" → "已获得 200 点"（+200 额度）
#     after  : {"status":200,"code":0,"total":200,"signStatus":3}
#
#  ⚠ **这个活动页平时根本不存在** —— 只有用户点开「免费领额度」才会出现。
#    计划任务跑的时候没人替我们点，所以配方用 `open_target` 声明"我自己开一个"：
#    驱动走 CDP `Target.createTarget` 在**同一个 profile（同一份登录态）**里开页面，
#    用完按 targetId 关掉。不点 UI、不动用户已经开着的那个标签页。
#    （为什么不点 UI：那个菜单是 Radix 组件，合成 click() 无效，只能发真实鼠标事件，
#      而坐标随窗口尺寸变 —— 太脆。实测过，别回头。）
#
#  ⚠ `checkin` 的返回值只说明"这次调用被接受了"，**不等于"今天新领到"**。
#    判据永远落在**领取后重读 detail** 的 task_status 上（驱动第 3 步做复核，
#    复核不过会主动降级 no_action）。
#
#  ⚠ 不配 `refresh_ui_after_claim`：我们操作的是自己开的临时页面，不涉及 UI 同步。
#    用户那个活动页标签页的文案会滞后（仍显示"立即签到"），但**额度是服务端记账**，
#    以 detail 接口为准。
# ============================================================
id: doubaowork
name: 豆包工作（DoubaoWork）每日签到
enabled: true              # 2026-10-21 真机验证：status / claim / 复核 三段全通
mode: client

verdict:
  transport: body_code
  rules:
    - { code: 0,   result: success }
    - { code: 401, result: need_login }
    - { code: 403, result: need_login }
  unknown_result: no_action
  # 由 status_js 从 tasks[] 里提上来的布尔量（task_status==3）
  checked_in_flag: hasIssued

client:
  exe: '%LOCALAPPDATA%\DoubaoWork\Application\DoubaoWork.exe'
  exe_glob: ''
  # 调试端口 —— 单一事实源：tools/win_shortcut_args.py 与自启动项都以这里为准。
  # 台账：9333=网页侧专用浏览器 / 9336=WorkBuddy / 9338=Trae / 9340=Qoder /
  #       9341=DuMate / 9342=本应用。
  debug_port: 9342
  # 它有十几个同 exe 名的子进程（renderer/GPU/utility），靠 `--type=` 过滤主进程。
  process_match: 'DoubaoWork.exe'
  launch_timeout_sec: 90      # 它要拉起 agent/rtc/vm 一整套，比别的客户端慢
  target_timeout_sec: 30

  # 主窗口（自定义协议）
  target_match: 'doubaowork-chat'
  main_target_match: 'doubaowork-chat'

  # 绝不关用户的客户端：这是用户日常在用的 AI 工作助手（还托管着定时任务/云电脑/
  # skill 运行时），关掉等于打断他手上的活。字段必须**显式**写 —— 代码默认 true，
  # WorkBuddy 那份配方就因为注释写了 false、字段漏着，差点误关用户主力工具。
  close_after: false

  # 无端口守候：调试端口只能在**启动时**绑定，而它开机自启后往往一开就是一整天。
  # 端口不通时按此守候，用户中途重启（带上 9342）即接管补领。
  wait_port_sec: 5400

  # 端口绑定失败（命令行带了端口、端口却连不上 ⇒ 已知不会自愈）⇒ 自动重启并当场补领。
  restart_on_bind_failure: true

  # 命令行完全没有端口参数（升级重启 / 别处拉起）⇒ 修入口 + 授权自行重启。
  repair_launch_entry: true
  restart_when_portless: true
  # ⚠ 实测它**自己重启主进程时会把调试参数丢掉**（2026-10-21 20:33：升级后新实例
  #   只剩 `--start_time=...`）⇒ 上面两条自愈路径对它是真的会被用到，不是装饰。

  # ---- 重启前的"忙闲"把关 ----
  # 只有判定为**空闲**才放行；忙则挂载监测（最多 wait_busy_sec）；**看不清同样不重启**。
  # 这个客户端随时可能在跑 agent 任务，误重启的代价比别的站点都高。
  busy_probe:
    busy_js: |
      (() => {
        const vis = el => { try { const r = el.getBoundingClientRect();
          return r.width > 0 && r.height > 0; } catch (e) { return false; } };
        const cn = el => { const c = el.className;
          return typeof c === 'string' ? c : (c && c.baseVal) || ''; };
        const txt = el => ((el.innerText || el.textContent || '') + '').trim();
        const CLS = /running|processing|loading|spinner|busy/i;
        const TXT = /执行中|运行中|进行中|处理中|排队中|等待中|生成中|停止生成/;
        for (const el of document.querySelectorAll('*')) {
          if (!vis(el)) continue;
          const c = cn(el);
          if (c && CLS.test(c)) return true;
          const a = el.getAttribute ? (el.getAttribute('aria-label') || '') : '';
          if (a && (CLS.test(a) || TXT.test(a))) return true;
          const t = txt(el);
          if (t && t.length < 24 && TXT.test(t)) return true;
        }
        return false;
      })()
    wait_busy_sec: 1800

  # 签到入口不在主窗口里，而在内置浏览器打开的活动页上 —— 由驱动自己开一个。
  open_target:
    url: 'https://www.doubao.com/pc/agent-explore'
    wait_sec: 10              # 活动页是异步渲染的，太短会拿到空 DOM（接口本身不依赖渲染）
    close_after: true

  bridge:
    status_js: |
      (async () => {
        const base = '/alice/ug/campaign/v3/detail/?version_code=20800&language=zh'
          + '&device_platform=web&doubao_device_platform=web&aid=497858&real_aid=497858'
          + '&pkg_type=release';
        try {
          const r = await fetch(base, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ campaign_group_code: 'pc_incentive_task_mvp_v3' })
          });
          const sc = r.status;
          const j = await r.json();
          const d = j.data || {};
          const sign = (d.tasks || []).find(t => t && t.campaign_code === 'daily_signin') || {};
          let c = (typeof j.code === 'number') ? j.code : (sc === 200 ? 0 : -1);
          if (c === 0 && (sc === 401 || sc === 403)) c = sc;
          return JSON.stringify({ code: c, data: {
            hasIssued: sign.task_status === 3,
            taskStatus: sign.task_status,
            totalPoints: (d.progress || {}).total_amount,
            statusCode: sc
          }});
        } catch (e) {
          return JSON.stringify({ code: -1, data: { error: String(e && e.message || e) } });
        }
      })()
    claim_js: |
      (async () => {
        const url = '/alice/ug/campaign/landing/checkin?version_code=20800&language=zh'
          + '&device_platform=web&doubao_device_platform=web&aid=497858&real_aid=497858'
          + '&pkg_type=release';
        try {
          const r = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ scene: 'pc_incentive_task_mvp_v3' })
          });
          const sc = r.status;
          const j = await r.json();
          let c = (typeof j.code === 'number') ? j.code : (sc === 200 ? 0 : -1);
          if (c === 0 && (sc === 401 || sc === 403)) c = sc;
          // ⚠ claimed 只作日志留痕；真判据是驱动随后重读 status 的 task_status
          return JSON.stringify({ code: c, data: {
            claimed: true,
            message: j.message || '',
            statusCode: sc
          }});
        } catch (e) {
          return JSON.stringify({ code: -1, data: { error: String(e && e.message || e) } });
        }
      })()
