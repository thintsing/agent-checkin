# ============================================================
#  站点配方 · Trae CN (字节跳动 AI IDE)
#  形态：client —— 驱动桌面客户端自己完成签到（复用客户端持有的登录态与设备身份）。
#
#  ---- 2026-10-12 静态取证（只读 app.asar/out，未逆向、未碰鉴权文件）----
#  客户端版本：Trae CN 1.107.1（VSCode 1.107 内核，Electron 壳）。
#
#  签到接口（`out/main.js` 内定义，主进程 ttnet 网络层发出）：
#      fetchCheckinCreditsStatus() → POST /trae/api/v2/ug/checkin_credits/status
#      claimCheckinCredits()       → POST /trae/api/v2/ug/checkin_credits/claim
#      // 成功判据（客户端自己的）：status===200 && (data.code 不存在 || data.code===0)
#      // 请求头由 fb(e) 注入：e["x-device-id"] = this.S.guaranteedDeviceId
#
#  ---- 2026-10-12 真机实测（端口 9338，**端到端跑通**）----
#  ★ 主路径 = `bridge`：在 renderer 里直接调**客户端自己的 IPC 通道**，
#    等价于用户点签到按钮，不点 DOM、不重载窗口。
#
#    链路（静态取证 + 实测复验）：
#      renderer 命令 workbench.action.icubeClaimCheckinCredits
#        → claimIdeCheckinCredits(source)
#        → claimCheckinCredits()
#        → ipcRenderer.invoke('vscode:sandbox::main-invoke-claimCheckinCredits')
#        → 主进程 ttnet → POST /trae/api/v2/ug/checkin_credits/claim
#
#    renderer 侧的 `window.vscode` 是 Electron preload 经 contextBridge 暴露的桥，
#    含 `ipcRenderer.{send,invoke,on,once,removeListener}` —— 这是**客户端自己的**
#    公开通道，与"点按钮"走的是同一条路；不伪造请求、不碰 token / 设备身份文件。
#
#    实测证据（2026-10-12 17:5x，当日未签状态下）：
#      status before : {"status":200,"data":{"checked_in":false,"did_checked_in":false,
#                                            "enable":true,"code":0,"credits":100}}
#      claim         : {"status":200,"data":{"code":0,"message":"success"}}
#      status after  : {"checked_in":true,"did_checked_in":true}   ← 服务端铁证
#
#  ⚠ 为什么不用 DOM（与 Qoder 的**结构性差异**）：
#    Qoder 的活动页是**独立 OOPIF target**（`growth-page`），驱动能"等 target → 点按钮"。
#    Trae CN 是 **Solo Lite 新 UI**（侧栏 task-list + chat panel），签到入口是左下角
#    账号触发器（`button.accountTrigger-*`，class 带构建期 hash）点开后的浮层 ──
#    没有独立 target、没有 aria-label、文案由服务端下发。实测直接点该按钮打开的是
#    **付费页**（z=9999 的"升级权益"全屏面板），并非账号菜单。
#    ⇒ 点 DOM 这条路既脆又不可靠；bridge 才是主路径。
#
#  ⚠ `target_match` 必须是实测值：Trae 的渲染进程 URL 是
#    `vscode-file://vscode-app/c:/.../resources/app/out/vs/...`（**不是** workbench.html）。
#    bridge 靠它选中主窗口 renderer —— 写错 = 永不命中 = 每天静默 no_action。
#
#  ⚠ 不配 `log_state`：main.log 只记 `ttnet fetch request <url>` 与响应状态码，
#    **不落响应体**，判不出 checked_in。没有可靠旁证就不硬凑。
#
#  ⚠ `close_after: true`（用户 2026-10-12 选「自动拉起，签完关掉」，与 Qoder 同策略）：
#    它只作用于"客户端本来没在跑、由我们拉起"那条路（`run()` 分支④）——
#    用户自己在用的实例（分支②③）永远不关，故不存在"误关用户 IDE"。
#    关掉的理由：不留调试端口 = 不留后门。
# ============================================================
id: trae
name: Trae CN 每日签到
enabled: true              # 2026-10-12 真机端到端验证通过（status/claim/复核 三段全通）
mode: client

# 判定：业务码只认**顶层** code（bridge 表达式已把 data.code 提上来）。
# 只配 code=0→success —— "活动已结束 / 不满足条件"这类业务拒绝会落到 unknown → no_action，
# 且驱动在报 success 之前**必再读一次 status 复核**，所以不存在"假成功"。
verdict:
  transport: body_code
  rules:
    - { code: 0, result: success }
  http_401_result: need_login
  unknown_result: no_action
  # 响应体 data 里表示"今日已签"的字段（实测：未签 false → 领取后 true）。
  # 有它才能在已签时**收手**，绝不重复调 claim。
  checked_in_flag: checked_in

client:
  # electron-builder per-user 安装，路径固定，无 Qoder 那种滚动版本目录。
  exe: '%LOCALAPPDATA%\Programs\Trae CN\Trae CN.exe'
  exe_glob: ''
  # 调试端口 —— **单一事实源**：tools/win_shortcut_args.py 写快捷方式时读这里。
  # 9333=网页侧专用浏览器；9336=WorkBuddy；9337=Qoder；9338=本应用。
  # （9334/9335 已被僵尸监听占死，不可复用。）
  debug_port: 9338
  # 按命令行匹配主进程（排除渲染/GPU 等 --type=* 子进程与 app-host 助手）
  process_match: 'Trae CN.exe'
  # VSCode 系启动较慢，给足时间
  launch_timeout_sec: 90
  target_timeout_sec: 30

  # 主窗口 renderer 的 URL 特征（2026-10-12 实测）。
  # 第二个 page target 是 `file:///.../iCubeFloat...`（60x100 悬浮球），不匹配本串 —— 正好排除。
  target_match: 'vscode-file://'
  main_target_match: 'vscode-file://'

  # ---- bridge：不点 DOM，直接调客户端自己的 IPC 通道 ----
  # 表达式**必须返回 JSON 字符串**（跨 CDP 边界用 returnByValue，字符串最稳），
  # 且驱动侧只认**顶层 `code`** —— 故这里把业务码从 `data.code` 提上来，
  # 原始 `data` 原样带出，供上面 `verdict.checked_in_flag` 读取。
  # 脚本内容属于**站点知识**（含产品名/IPC channel），所以放配方；驱动侧不含任何产品名。
  bridge:
    status_js: |
      (async () => {
        const r = await window.vscode.ipcRenderer.invoke(
          'vscode:sandbox::main-invoke-fetchCheckinCreditsStatus');
        const d = (r && r.data) || {};
        const c = (typeof d.code === 'number') ? d.code : ((r && r.status === 200) ? 0 : -1);
        return JSON.stringify({code: c, data: d});
      })()
    claim_js: |
      (async () => {
        const r = await window.vscode.ipcRenderer.invoke(
          'vscode:sandbox::main-invoke-claimCheckinCredits');
        const d = (r && r.data) || {};
        const c = (typeof d.code === 'number') ? d.code : ((r && r.status === 200) ? 0 : -1);
        return JSON.stringify({code: c, data: d});
      })()

  # 领取后关闭**我们拉起的那个**客户端（不留调试端口 = 不留后门）。
  # 用户选「自动拉起，签完关掉」（2026-10-12），与 Qoder 同策略。
  # ⚠ 语义澄清：`close_after` 只作用于 `run()` 分支④（客户端本来没在跑、由我们拉起）；
  #   用户自己在用的实例（分支②③）**永远不会**被关 —— 故不存在"误关用户 IDE"。
  close_after: true
  # 无端口守候：调试端口只能在启动时绑定，IDE 可能连续数天不重启
  # ⇒ 无端口时按此守候，用户中途重启（带上端口）即接管补领。
  #
  # ⚠ 但守候**只对"没带端口参数"那种情况有用**。2026-10-14 实测到另一种形态：
  #   命令行**带着** `--remote-debugging-port=9338`，端口却根本不存在 ——
  #   成因是 Trae 用「重启」时 `app.quit()` 与拉起新实例只隔 **1 秒**（旧例 11:54:28.288
  #   quit、新进程 11:54:29 创建），9338 还没释放完 ⇒ 新实例 `listen()` 失败后**静默继续跑**。
  #   这种实例整个生命周期都没有端口，守候再久也不会出现。
  #   ⇒ 驱动已能分辨（判 `debug_port_bind_failed`，只做 45s 静默期探测后立刻提示重启）。
  #   📌 运维提示：手动重启 Trae 时**先完全退出**（确认任务管理器里没有 `Trae CN.exe`），
  #      停 2~3 秒再打开即可规避；日常自启 / 走快捷方式启动**不受影响**（无新旧交接）。
  wait_port_sec: 5400

  # 端口绑定失败时**自动重启客户端并当场重试**（用户 2026-10-14 授权"该重启重启，
  # 不要摆着"）。只在"命令行已带端口参数、但端口连不上"这一种**已知不会自愈**的情况下
  # 触发；实现见 `ClientDriver._restart_client`：
  #   优雅关闭 → 确认进程真的退干净 → **等端口释放**（这步不能省）→ 带端口重新拉起。
  restart_on_bind_failure: true

  # ---- 端口的三种坏法，各自的自愈手段（2026-10-17 补齐后两种）----
  #   ① 僵尸 socket（LISTENING 记在**已死 PID** 名下）⇒ 本端口拿不回来，
  #      自动挑一个干净端口、写回本文件的 `debug_port`，再用新端口重启客户端。
  #   ② 命令行里**完全没有**端口参数 ⇒ 对策两条：
  #        repair_launch_entry    把启动入口改回带端口（只影响**下一次**启动）。
  #        restart_when_portless  授权在"确认客户端空闲"后**自行重启**并当场补领。
  #                               仍要过下面的忙闲关；看不清照样不动手。
  repair_launch_entry: true
  restart_when_portless: true

  # ---- 重启前的"忙闲"把关（用户 2026-10-14 要求）----
  # 用户原话："需要重启的话也不要直接重启，看看有没有在执行的任务，有的话就先不重启，
  # 挂载任务监测着，等任务执行完了再重启。"
  # ⚠ 2026-10-17 修了一处"名存实亡"：`busy_js` 必须连着端口才能跑，而"端口不通"
  #   正是我们唯一想重启的场景 ⇒ 这条关此前**永远**返回"看不清" ⇒ 授权过的一次也没重启成。
  #   现在 busy_js 取不到结论时会退到**进程 CPU 旁证**（见下面的 cpu_window_sec）。
  # 只有判定为**空闲**才放行；忙则挂载监测（最多 wait_busy_sec）；**看不清同样不重启**
  # （宁可漏签，也不能赌一把打断用户正在跑的任务）。
  #
  # ⚠ 本站点用的是**通用判据**：2026-10-14 侦察时 Trae 空闲（侧栏「暂无任务」），
  #    拿不到"忙时"的真实特征。判据如下：
  #      class / aria-label 含 running|processing|loading|spinner|busy，
  #      或可见短文本（<24 字）含 执行中/运行中/进行中/处理中/排队中/等待中。
  #    判据词**刻意不含** execution / progress —— **实测** Trae 空闲时就带着
  #    `task-panel-slide-executions` 与 `executionEnvironmentButton`，含这两个词会**永远**
  #    误判为忙、导致永远不重启。这是本次接入专门验过的一条。
  #    取向偏保守：宁可多等一会儿，也不能误判为空闲而错误重启。
  #    ⇒ 将来若发现漏判（有任务却没被认出），应优先**加强判据**而不是放宽。
  busy_probe:
    busy_js: |
      (() => {
        const vis = el => { try { const r = el.getBoundingClientRect();
          return r.width > 0 && r.height > 0; } catch (e) { return false; } };
        const cn = el => { const c = el.className;
          return typeof c === 'string' ? c : (c && c.baseVal) || ''; };
        const txt = el => ((el.innerText || el.textContent || '') + '').trim();
        const deepAll = (root, sel, out, depth) => {
          out = out || []; depth = depth || 0; if (depth > 12) return out;
          let list = []; try { list = root.querySelectorAll(sel); } catch (e) { return out; }
          for (const el of list) out.push(el);
          let kids = []; try { kids = root.querySelectorAll('*'); } catch (e) { return out; }
          for (const el of kids) if (el.shadowRoot) deepAll(el.shadowRoot, sel, out, depth + 1);
          return out;
        };
        const CLS = /running|processing|loading|spinner|busy/i;
        const TXT = /执行中|运行中|进行中|处理中|排队中|等待中/;
        for (const el of deepAll(document, '*')) {
          if (!vis(el)) continue;
          const c = cn(el);
          if (c && CLS.test(c)) return true;
          const a = el.getAttribute ? (el.getAttribute('aria-label') || '') : '';
          if (a && (CLS.test(a) || TXT.test(a))) return true;
          const t = txt(el);
          if (t && t.length < 24 && TXT.test(t)) return true;
        }
        return false;
      })()
    # 监测上限（秒）。超时则降级提醒，绝不无限等。
    wait_busy_sec: 1800
    # 端口不通时 `busy_js` 必然取不到结论（它得连着调试端口才能跑）⇒ 退到**进程 CPU 旁证**：
    # 观测窗 `cpu_window_sec` 内，该客户端全部进程合计消耗的 CPU（核·秒）小于
    # `idle_cpu_sec` 才算空闲。阈值刻意留大 —— Electron 空闲也会有心跳、有时还会
    # 跑后台索引；宁可判"忙"多等一会儿，也不能把正在干活的实例干掉。
    cpu_window_sec: 5.0
    idle_cpu_sec: 1.0

  # 日志是多会话目录形态（logs/<session>/main.log），但**不记响应体**，
  # 无法据此判已领 ⇒ 不配 log_state（详见文件头注释）。
  data_dir: '%APPDATA%\Trae CN'

reminder:
  # 开窗时刻闸门（HH:MM, UTC+8）。Trae 每日签到按北京时间日切，0 点即刷新
  # ⇒ 不设额外限制（全局随机窗 10:05–12:30 已在其后）。
  not_before: '00:00'
  toast_title: 'Trae CN 每日签到提醒'
  toast_body: '打开 Trae CN → 从桌面快捷方式启动（带调试端口）→ 或运行 python -m checkin --now --only-site trae 补签。'
  note: '签到入口在账号菜单；每日 0 点（UTC+8）刷新一轮，每轮 100 通用积分。'

schedule_hint:
  timezone: Asia/Shanghai
  refresh_hour_utc8: 0
